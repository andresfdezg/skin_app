[project]
name = "vibe-skin"
version = "0.1.0"
description = "Skin lesion classification from phone photos (MVP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "albumentations",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "matplotlib",
    "tqdm",
    "tabulate>=0.10.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_skin"]

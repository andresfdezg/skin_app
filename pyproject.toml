[project]
name = "vibe-skin"
version = "0.1.0"
description = "Skin lesion classification from phone photos (MVP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "albumentations",
    "scikit-learn",
    "pandas",
    "pyyaml",
    "matplotlib",
    "tqdm",
    "tabulate>=0.10.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_skin"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
